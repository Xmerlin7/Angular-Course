<div class="row g-3 m-2">
  @for (product of products; track product.id) {
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card h-100 shadow-sm position-relative">
        <span
          class="badge rounded-pill position-absolute top-0 end-0 m-2"
          [class.text-bg-success]="product.inStock"
          [class.text-bg-danger]="!product.inStock"
        >
          {{ product.inStock ? 'In Stock' : 'Out of Stock' }}
        </span>

        <img
          [src]="product.imageSrc"
          [alt]="product.imageAlt"
          [title]="product.imageAlt"
          class="card-img-top img-fluid object-fit-cover"
          style="height: 220px"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.productName }}</h5>
          <p class="fw-bold mb-3"
          [class.text-danger]="product.price > 400"
          [class.text-success]="product.price < 400"
          >$ {{ product.price }}</p>
          <button class="btn btn-primary mt-auto">Buy</button>
        </div>
      </div>
    </div>
  }
</div>
